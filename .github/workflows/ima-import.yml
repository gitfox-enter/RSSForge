name: ima 知识库导入

on:
  workflow_dispatch:
    inputs:
      enable_import:
        description: 是否启用导入
        type: boolean
        default: true
      max_items:
        description: 最大导入条数
        type: number
        default: 200

env:
  IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
  IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
  IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
  IMA_DEFAULT_FOLDER_ID: ${{ secrets.IMA_DEFAULT_FOLDER_ID }}
  ENABLE_IMA_IMPORT: ${{ vars.ENABLE_IMA_IMPORT || 'true' }}

jobs:
  import:
    if: ${{ github.event.inputs.enable_import == 'true' || github.event.inputs.enable_import == '' && env.ENABLE_IMA_IMPORT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 检查 items_latest.json 是否存在
        run: |
          if [ ! -f items_latest.json ]; then
            if [ -f items.json ]; then
              echo "items_latest.json 不存在，使用 items.json 作为备选"
              cp items.json items_latest.json
            else
              echo "错误：items_latest.json 和 items.json 均不存在"
              exit 1
            fi
          fi
          echo "items_latest.json 大小: $(wc -c < items_latest.json) 字节"

      - name: 运行 ima 导入脚本
        run: python ima_import_workflow.py

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ima-import-log
          path: |
            ima_import.log
            imported_urls.json
          retention-days: 7