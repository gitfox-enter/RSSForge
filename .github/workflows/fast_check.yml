name: 快速增量检查

on:
  schedule:
    # 每 15 分钟唤醒，由 smart_scheduler 决定是否执行（提高触发点密度，降低被 GitHub 漏触发的影响）
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

concurrency:
  group: site-monitor
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
      issues: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 配置 Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 运行快速检查
        run: python fast_check.py

      - name: 生成 RSS Feed
        run: python rss_feed.py

      - name: 生成 OPML
        run: python opml_generator.py

      - name: 提交变更
        run: |
          set +e

          # 使用排他性文件名策略：仅 commit fast_check workflow 负责的文件
          git add -u feeds_meta.json 2>/dev/null || true
          git add docs/feeds/ 2>/dev/null || true
          git add -u scheduler_state.json fast_log.jsonl 2>/dev/null || true
          git add -u docs/opml.xml docs/opml.*.xml docs/icons/ 2>/dev/null || true

          git status
          if git diff --staged --quiet 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi

          if git diff --staged --name-only | grep -q "feed.xml\|adaptive_tiers.json"; then
            COMMIT_MSG="快速更新: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          else
            COMMIT_MSG="状态更新: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          fi

          git commit -m "$COMMIT_MSG"

          # Pull rebase with autostash to handle concurrent pushes
          push_success=false
          for i in 1 2 3 4 5; do
            echo "=== Push attempt $i ==="
            git pull --rebase origin main --autostash || true
            # Handle conflicts: fast_check is authoritative for feeds data
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U | while read conflict_file; do
                case "$conflict_file" in
                  docs/feeds/*|feeds_meta.json|items*.json|run_log.jsonl|adaptive_tiers.json)
                    echo "Conflict in $conflict_file: keeping fast_check local version"
                    git checkout --ours "$conflict_file" 2>/dev/null
                    ;;
                  *)
                    echo "Conflict in $conflict_file: accepting remote version"
                    git checkout --theirs "$conflict_file"
                    ;;
                esac
                git add "$conflict_file"
              done
              git rebase --continue 2>/dev/null || true
            fi
            if git push --force-with-lease origin main; then
              push_success=true
              echo "Push succeeded"
              break
            fi
            echo "Push attempt $i failed, waiting before retry..."
            sleep 3
          done
          if [ "$push_success" = true ]; then
            echo "Changes committed and pushed successfully"
          else
            echo "All push attempts failed"
            exit 1
          fi