name: 站点抓取（仅抓取模式）

on:
  schedule:
    - cron: '0,30 * * * *'
    - cron: '0 7,12,18,22 * * *'
  workflow_dispatch:

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行抓取
        run: python crawl.py

      - name: 提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -u items.json items_latest.json crawl_status.json scheduler_state.json run_log.jsonl hash_record.txt notified_items.json adaptive_tiers.json 2>/dev/null || true
          git status --short
          if git diff --staged --quiet 2>/dev/null; then
            echo "无数据变更"
            exit 0
          fi
          git commit -m "抓取: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          for i in 1 2 3; do
            git pull --rebase origin main 2>/dev/null || true
            if git push origin main; then echo "推送成功"; exit 0; fi
            sleep 8
          done
          echo "推送失败"; exit 1
